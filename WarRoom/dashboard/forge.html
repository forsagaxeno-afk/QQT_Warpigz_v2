<!doctype html>
<!-- QQT_Warpigz_v3: WarRoom suite dashboard, "Forge" theme (warm dark war table).
     Open index.html from disk (double-click); it opens the last chosen theme.
     Layout and logic are shared with daylight.html and console.html (base.css,
     app.js); this page only sets the theme. Reads suite_data.js from this folder
     every write_every s (min 5 s). No server, no internet, no external files. -->
<html lang="en" data-wr-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarRoom — Live</title>
<link rel="stylesheet" href="base.css">
<style>
:root {
  color-scheme: dark;
  --bg: #0e0a07; --bg2: #140f0b; --panel: #19130e; --panel2: #221a13; --line: #30251b; --line2: #4a3a2a;
  --ink: #efe4cc; --muted: #b3a083; --dim: #8a7860; --bronze: #8f7b5c; --ember: #e8743b; --gold: #e3ab45;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Charter, "Bitstream Charter", "Liberation Serif", Georgia, serif;
  --sans: system-ui, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
  --body-font: 14px/1.5 var(--sans); --ctl-font: 500 13px/1.2 var(--sans); --pill-font: var(--sans); --num-font: var(--serif);
  --cap-font: 600 12px/1.2 var(--serif); --cap-track: .18em; --h1-font: 600 23px/1.1 var(--serif); --h1-track: .04em;
  --tab-font: 600 13px/1 var(--serif); --tab-track: .12em; --title-font: 600 26px/1.15 var(--serif); --big-font: 600 36px/1.05 var(--serif);
  --kpi-size: 30px; --name-font: 600 15px/1.25 var(--serif); --cnt-font: 600 24px/1 var(--serif); --th-font: 600 11px/1.2 var(--serif);
  --radius: 0; --radius-sm: 2px; --shadow: none; --sw-shape: rotate(45deg);
  --link: var(--gold); --focus: var(--gold); --ctl-bg: var(--panel2); --ctl-hover: var(--bronze);
  --accent: var(--ember); --accent-fill: linear-gradient(180deg, #eeb35a, #d98a3d); --on-accent: #1a120b; --accent-soft: rgba(232,116,59,.14); --accent-ink: #ffb088;
  --hero: var(--gold); --good: #9dbb8e; --good-line: rgba(157,187,142,.45); --warn: var(--gold); --warn-line: rgba(227,171,69,.5);
  --bad: #ff8a7a; --bad-line: rgba(192,57,43,.7); --bad-soft: rgba(192,57,43,.14);
  --sw-bg: var(--bg2); --tab-bg: var(--bg2); --chip-bg: #2c2219; --banner-bg: linear-gradient(90deg, rgba(34,26,19,.9), rgba(34,26,19,0));
  --banner-bad: linear-gradient(90deg, rgba(192,57,43,.18), rgba(192,57,43,0)); --now-bg: linear-gradient(180deg, var(--panel2), var(--panel) 60%);
  --track: #2a2019; --bar-fill: linear-gradient(90deg, #d98a3d, var(--ember)); --hover: rgba(233,220,192,.04); --grid: #2a2019; --tip-bg: rgba(20,14,10,.97);
  --a-pit: #3987e5; --a-helltide: #d95926; --a-undercity: #199e70; --a-hordes: #c98500; --a-bosses: #d55181; --a-whispers: #9085e9; --a-neutral: #3a2e22;
  --r-mythic: #b98cf0; --r-unique: #d9c38f; --r-legendary: #e8843b; --r-rare: #e6c84a; --r-magic: #6f8fe8; --r-common: #9a9a9a;
  --c-gold: var(--gold); --c-xp: #c9b58f;
}
body { background: radial-gradient(1200px 600px at 20% -10%, rgba(232,116,59,.09), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, rgba(192,57,43,.06), transparent 60%), var(--bg); background-attachment: fixed; }
.hrsw .hrsw-lbl { font-family: var(--serif); font-variant: small-caps; text-transform: none; font-size: 13px; }
.hrsw a { font-family: var(--serif); font-variant: small-caps; letter-spacing: .05em; font-size: 14px; }
header.top .in { position: relative; }
header.top { border-bottom: 1px solid var(--line); position: relative; }
header.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: linear-gradient(90deg, var(--ember), rgba(232,116,59,0) 70%); opacity: .5; }
.brand h1 { font-variant: small-caps; }
.brand .sub { font-family: var(--serif); font-style: italic; font-size: 14px; }
#dot { transform: rotate(45deg); }
#dot.live { background: var(--ember); box-shadow: 0 0 10px 2px rgba(232,116,59,.6); animation: ember 2.4s ease-in-out infinite; }
@keyframes ember { 50% { box-shadow: 0 0 3px 1px rgba(232,116,59,.25); opacity: .75; } }
.tabbar { margin-top: 14px; }
.tabbar .sep { background: repeating-linear-gradient(45deg, transparent 0 3px, rgba(74,58,42,.5) 3px 4px); }
.banner { font: italic 14px/1.45 var(--serif); }
.banner::before { content: "\2756"; font-style: normal; color: var(--dim); }
.banner.warn::before { color: var(--gold); } .banner.bad::before { color: var(--bad); }
.panel.framed::before, .panel.framed::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--bronze); pointer-events: none; }
.panel.framed::before { left: -3px; top: -3px; border-right: 0; border-bottom: 0; }
.panel.framed::after { right: -3px; bottom: -3px; border-left: 0; border-top: 0; }
.phead .aside, .queue .plan, .foot { font-family: var(--serif); font-style: italic; }
.counter .n small, .kpis .n small, .acts .cnt small { font-family: var(--serif); font-style: italic; }
.bar i { border-radius: 0 4px 4px 0; }
.rar .trk i, .hbar .trk i { border-radius: 0 4px 4px 0; }
.foot span::before { content: "\2756  "; font-style: normal; }
.tip b { font-family: var(--serif); font-size: 13.5px; }
.tip { border-color: var(--bronze); border-left-color: var(--gold); }
.frame { box-shadow: inset 0 0 0 1px rgba(143,123,92,.2); }
</style>
</head>
<body>
<nav class="hrsw" aria-label="Dashboard theme"><div class="hrsw-in"><span class="hrsw-lbl">Theme</span><div class="hrsw-seg"><a href="forge.html" data-theme-file="forge" class="cur" aria-current="page">Forge</a><a href="daylight.html" data-theme-file="daylight">Daylight</a><a href="console.html" data-theme-file="console">Console</a></div></div></nav>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
