<!doctype html>
<!-- QQT_Warpigz_v3: WarRoom suite dashboard, "Console" theme (amber terminal).
     Open index.html from disk (double-click); it opens the last chosen theme.
     Layout and logic are shared with forge.html and daylight.html (base.css,
     app.js); this page only sets the theme. Reads suite_data.js from this folder
     every write_every s (min 5 s). No server, no internet, no external files. -->
<html lang="en" data-wr-theme="console">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarRoom — Live</title>
<link rel="stylesheet" href="base.css">
<style>
:root {
  color-scheme: dark;
  --bg: #070605; --bg2: #0c0a07; --panel: #0c0a07; --panel2: #0e0b07; --line: #2b2316; --line2: #45371f;
  --ink: #ffc766; --bright: #ffe6b3; --muted: #b58d4c; --dim: #8a7045; --amber: #ffb000;
  --mono: "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", Consolas, "DejaVu Sans Mono", Menlo, monospace;
  --body-font: 13px/1.5 var(--mono); --ctl-font: 12px/1.3 var(--mono); --pill-font: var(--mono); --num-font: var(--mono);
  --cap-font: 700 11px/1.3 var(--mono); --cap-track: .14em; --h1-font: 700 15px/1.2 var(--mono); --h1-track: .14em;
  --tab-font: 700 12px/1 var(--mono); --tab-track: .08em; --title-font: 700 18px/1.25 var(--mono); --big-font: 700 28px/1.1 var(--mono);
  --kpi-size: 24px; --name-font: 700 13px/1.3 var(--mono); --cnt-font: 700 20px/1 var(--mono); --th-font: 400 10.5px/1.2 var(--mono);
  --radius: 0; --radius-sm: 0; --shadow: none; --sw-shape: none;
  --link: var(--amber); --focus: var(--bright); --ctl-bg: #0e0b07; --ctl-hover: var(--amber);
  --accent: var(--amber); --accent-fill: var(--amber); --on-accent: #0a0703; --accent-soft: rgba(255,176,0,.12); --accent-ink: var(--bright);
  --hero: var(--bright); --good: #62f59b; --good-line: rgba(98,245,155,.4); --warn: var(--amber); --warn-line: rgba(255,176,0,.5);
  --bad: #ff4b3e; --bad-line: rgba(255,75,62,.55); --bad-soft: rgba(255,75,62,.12);
  --sw-bg: var(--bg2); --tab-bg: var(--bg2); --chip-bg: #1a140b; --banner-bg: #0a0805; --banner-bad: rgba(255,75,62,.08); --now-bg: var(--bg2);
  --track: #1a140b; --bar-fill: repeating-linear-gradient(90deg, var(--amber) 0 5px, transparent 5px 7px); --hover: rgba(255,176,0,.05); --grid: #1f190f; --tip-bg: rgba(6,5,3,.96);
  --a-pit: #5cd9ff; --a-helltide: #ff6a3d; --a-undercity: #62f59b; --a-hordes: #ffb000; --a-bosses: #ff6ad5; --a-whispers: #c4a6ff; --a-neutral: #2e2616;
  --r-mythic: #c4a6ff; --r-unique: #e8d29a; --r-legendary: #ff8c3a; --r-rare: #ffe14d; --r-magic: #6f9bff; --r-common: #928a78;
  --c-gold: var(--amber); --c-xp: #d9b577;
}
body { letter-spacing: .01em; background-color: var(--bg);
  background-image: linear-gradient(rgba(255,176,0,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,176,0,.045) 1px, transparent 1px); background-size: 24px 24px; }
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 70; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
::selection { background: var(--amber); color: #000; }
button, select { text-transform: uppercase; letter-spacing: .06em; }
.hrsw { border-bottom-color: var(--line2); }
.hrsw a { text-transform: uppercase; letter-spacing: .06em; background: #0e0b07; }
.hrsw a:hover { color: var(--bright); }
.hrsw a.cur { color: #0a0703; background: var(--amber); }
header.top .in { margin-top: 14px; border: 1px solid var(--line2); background: var(--bg2); padding: 8px 12px; max-width: calc(1440px - 44px); }
.brand h1 { text-transform: uppercase; color: var(--bright); text-shadow: 0 0 10px rgba(255,176,0,.35); }
.brand h1 em { color: var(--amber); }
.brand h1 em::after { content: '//live'; color: var(--dim); font-weight: 400; margin-left: .35em; text-shadow: none; }
.brand .sub::before { content: '$ '; color: var(--dim); }
#dot { width: 9px; height: 15px; }
#dot.live { background: var(--amber); box-shadow: 0 0 8px rgba(255,176,0,.7); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pill { border: 0; background: transparent; padding: 6px 2px; }
.pill::before { content: '['; color: var(--dim); margin-right: 5px; }
.pill::after { content: ']'; color: var(--dim); margin-left: 5px; }
.pill.bad { background: transparent; }
.cap::before, .phead h2::before { content: '[ '; color: var(--dim); }
.cap::after, .phead h2::after { content: ' ]'; color: var(--dim); }
.phead { align-items: center; }
.phead h2 { color: var(--muted); order: 0; }
.phead::after { content: ''; flex: 1 1 40px; border-top: 1px dashed var(--line2); order: 1; min-width: 20px; }
.phead .aside, .phead a { order: 2; margin-left: 0; font-size: 11px; }
.tabbar { margin-top: 12px; border-color: var(--line2); }
.tabbar a[aria-current="page"] { color: #0a0703; background: var(--amber); border-bottom-color: var(--amber); }
.tabbar a[aria-current="page"] .cnt { background: #0a0703; color: var(--amber); }
.tabbar a[aria-current="page"] .sw { outline: 1px solid #0a0703; }
.tabbar .sep { background: repeating-linear-gradient(90deg, transparent 0 2px, rgba(69,55,31,.8) 2px 3px); }
.banner { border: 1px solid var(--line2); font-size: 12px; padding-left: 36px; }
.banner::before { content: '>>'; color: var(--dim); top: 10px; }
.banner b { color: var(--bright); text-transform: uppercase; letter-spacing: .05em; }
.banner.warn { border-color: rgba(255,176,0,.5); } .banner.bad { border-color: var(--bad-line); } .banner.bad b { color: var(--bad); }
.panel, .counters, .kpis { border-color: var(--line2); }
.panel.framed::before, .panel.framed::after { content: ''; position: absolute; width: 9px; height: 9px; border-color: var(--amber); border-style: solid; pointer-events: none; }
.panel.framed::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
.panel.framed::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
.now h3, .ahead h3 { text-transform: uppercase; color: var(--bright); letter-spacing: .04em; }
.now h3::before { content: '\25B8 '; color: var(--amber); }
.counter .n, .kpis .n { color: var(--bright); text-shadow: 0 0 12px rgba(255,176,0,.4); }
.counter.hero .n { color: var(--amber); }
.counter .n small, .kpis .n small { text-shadow: none; }
.bar { border: 1px solid var(--line); height: 9px; }
.acts td, table.t td { color: var(--bright); }
.acts td:first-child, table.t td:first-child { color: var(--muted); }
.acts .nm b { color: var(--bright); }
.kvs .kv { overflow: hidden; border-bottom: 0; padding: 3px 0; }
.kvs .kv span:first-child { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
.kvs .kv span:first-child::after { content: ' ........................................................'; color: var(--line2); }
.kvs .kv span:last-child { flex: none; color: var(--bright); max-width: 70%; }
.feed time::before, .alerts time::before { content: '['; } .feed time::after, .alerts time::after { content: ']'; }
.feed li, .drops li, .alerts li { border-bottom-style: dotted; }
.tag { border-radius: 0; }
.tag.ga { color: #0a0703; background: var(--amber); border-color: var(--amber); }
.chips button[aria-pressed="true"] { color: #0a0703; background: var(--amber); border-color: var(--amber); }
.plug { background: var(--bg2); border-color: var(--line2); }
.plug h3 { color: var(--bright); text-transform: uppercase; font-size: 13px; letter-spacing: .06em; }
.plug .st { border: 0; padding: 4px 0; }
.plug .st::before { content: '['; color: var(--dim); margin-right: 3px; } .plug .st::after { content: ']'; color: var(--dim); margin-left: 3px; }
.tip { border: 1px solid var(--amber); }
.golink a.btn { border-color: var(--amber); background: transparent; color: var(--amber); text-transform: uppercase; }
.golink a.btn:hover { background: var(--amber); color: #0a0703; }
.foot span::before { content: '// '; }
.strip i span { color: #0a0703; text-shadow: none; font-weight: 700; }
.strip i.cur { box-shadow: inset 0 0 0 2px var(--bright); }
@media (max-width: 700px) { header.top .in { margin: 10px 16px 0; } }
</style>
</head>
<body>
<nav class="hrsw" aria-label="Dashboard theme"><div class="hrsw-in"><span class="hrsw-lbl">Theme</span><div class="hrsw-seg"><a href="forge.html" data-theme-file="forge">Forge</a><a href="daylight.html" data-theme-file="daylight">Daylight</a><a href="console.html" data-theme-file="console" class="cur" aria-current="page">Console</a></div></div></nav>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
