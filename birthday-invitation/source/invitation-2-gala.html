<p class="row r1">Праздник пройдёт в&nbsp;парке <b>«Активизон»</b>,<br>стол в&nbsp;беседке <b>№&nbsp;4</b></p>
<p class="row r2">Энгельс, проспект Химиков,&nbsp;1,<br>строение&nbsp;5 (за&nbsp;«Лентой»)</p>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20261002);
const R=(a,b)=>a+(b-a)*rnd();
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const $=id=>document.getElementById(id);
const CX=540, CY=645;

const GOLD=[[0,[46,26,4]],[.22,[110,70,16]],[.45,[184,128,40]],[.66,[230,188,92]],[.84,[251,228,160]],[1,[255,251,232]]];
function ramp(stops,t){t=Math.max(0,Math.min(1,t));for(let i=1;i<stops.length;i++){if(t<=stops[i][0]){const a=stops[i-1],b=stops[i],f=(t-a[0])/(b[0]-a[0]);return 'rgb('+a[1].map((v,k)=>Math.round(v+(b[1][k]-v)*f)).join(',')+')'}}return 'rgb('+stops[stops.length-1][1].join(',')+')'}
const gold=t=>ramp(GOLD,t);

// ---------- bokeh ----------
const bk=$('bokeh');
const bcols=['#ffcf7a','#ffb45a','#ff7a5a','#ffd99a','#ff5a6a','#fff0c8'];
for(let i=0;i<46;i++){
  const x=R(-40,1120), y=R(-40,1300)*(rnd()<.6?.75:1);
  const r=R(10,62);
  el('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:r.toFixed(1),fill:bcols[i%bcols.length],opacity:R(.05,.2).toFixed(3),filter:r>30?'url(#blur8)':'url(#blur3)'},bk);
}

// bokeh continuing down around the venue card
const bkL=$('bokehLow');
for(let i=0;i<22;i++){
  const side=i%2?1:-1, x=i<14?(side<0?R(-30,110):R(970,1110)):R(80,1000), y=i<14?R(1180,1640):R(1548,1640);
  const r=R(8,44);
  el('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:r.toFixed(1),fill:bcols[i%bcols.length],opacity:R(.08,.24).toFixed(3),filter:r>26?'url(#blur8)':'url(#blur3)'},bkL);
}

// ---------- rays ----------
const rays=$('rays');
for(let i=0;i<54;i++){
  const a=R(0,Math.PI*2), w=R(.008,.035), L=R(420,820);
  const p=[[CX,CY],[CX+Math.cos(a-w)*L,CY+Math.sin(a-w)*L],[CX+Math.cos(a+w)*L,CY+Math.sin(a+w)*L]];
  el('polygon',{points:p.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' '),fill:'url(#rayGrad)',opacity:R(.25,.7).toFixed(2)},rays);
}

// ---------- pleated rosette ----------
const pl=$('pleats');
const N=64, rIn=160, rOut=208, rBump=217;
const L2=[-0.707,-0.707];
for(let i=0;i<N;i++){
  const a0=i/N*2*Math.PI, a1=(i+1)/N*2*Math.PI, am=(a0+a1)/2;
  for(let h=0;h<2;h++){
    const ta=[-Math.sin(am),Math.cos(am)], ra=[Math.cos(am),Math.sin(am)];
    const sgn=h?-1:1;
    const b=.5+.36*sgn*(ta[0]*L2[0]+ta[1]*L2[1])+.2*(ra[0]*L2[0]+ra[1]*L2[1])+R(-.04,.04);
    const pt=(a,r)=>[CX+Math.cos(a)*r,CY+Math.sin(a)*r];
    const pts=h?[pt(am,rIn),pt(am,rBump),pt(a1,rOut),pt(a1,rIn)]:[pt(a0,rIn),pt(a0,rOut),pt(am,rBump),pt(am,rIn)];
    el('polygon',{points:pts.map(q=>q.map(v=>v.toFixed(2)).join(',')).join(' '),fill:gold(b),stroke:gold(b),'stroke-width':.6},pl);
  }
}

// ---------- reactor segments ----------
const sg=$('segments');
const sgGlow=el('g',{filter:'url(#glowC)'},sg);
for(let i=0;i<10;i++){
  const a0=(i/10)*2*Math.PI-Math.PI/2+0.075, a1=((i+1)/10)*2*Math.PI-Math.PI/2-0.075;
  const r0=113,r1=140;
  const P=(a,r)=>(CX+Math.cos(a)*r).toFixed(2)+','+(CY+Math.sin(a)*r).toFixed(2);
  el('path',{d:`M${P(a0,r0)} L${P(a0,r1)} A${r1},${r1} 0 0,1 ${P(a1,r1)} L${P(a1,r0)} A${r0},${r0} 0 0,0 ${P(a0,r0)}Z`,fill:'url(#segG)'},sgGlow);
  // copper coil lines across each segment
  for(let k=1;k<6;k++){const a=a0+(a1-a0)*k/6;
    el('line',{x1:(CX+Math.cos(a)*(r0+2)).toFixed(2),y1:(CY+Math.sin(a)*(r0+2)).toFixed(2),x2:(CX+Math.cos(a)*(r1-2)).toFixed(2),y2:(CY+Math.sin(a)*(r1-2)).toFixed(2),stroke:'#39b6e0','stroke-width':.8,opacity:.45},sg);}
}

// ---------- curled ribbon (3D helix projected) ----------
const Lv=(()=>{const v=[-.45,-.6,.66],l=Math.hypot(...v);return v.map(x=>x/l)})();
const Hv=(()=>{const v=[Lv[0],Lv[1],Lv[2]+1],l=Math.hypot(...v);return v.map(x=>x/l)})();
function curl(parent,P0,P1,P2,turns,rad,w,opt={}){
  const steps=Math.ceil(turns*40), pts=[];
  for(let i=0;i<=steps;i++){
    const s=i/steps, th=s*turns*2*Math.PI+(opt.phase||0);
    const x=(1-s)*(1-s)*P0[0]+2*(1-s)*s*P1[0]+s*s*P2[0];
    const y=(1-s)*(1-s)*P0[1]+2*(1-s)*s*P1[1]+s*s*P2[1];
    let tx=2*(1-s)*(P1[0]-P0[0])+2*s*(P2[0]-P1[0]), ty=2*(1-s)*(P1[1]-P0[1])+2*s*(P2[1]-P1[1]);
    const tl=Math.hypot(tx,ty);tx/=tl;ty/=tl;
    const nx=-ty, ny=tx, r=rad*(1-(opt.taper||0)*s);
    pts.push({x:x+nx*r*Math.cos(th),y:y+ny*r*Math.cos(th),tx,ty,nx,ny,th});
  }
  const quads=[];
  for(let i=0;i<steps;i++){
    const a=pts[i],b=pts[i+1],thm=(a.th+b.th)/2;
    const n=[a.nx*Math.cos(thm),a.ny*Math.cos(thm),Math.sin(thm)];
    const front=Math.sin(thm)>=0, nv=front?n:n.map(v=>-v);
    const d=Math.max(0,nv[0]*Lv[0]+nv[1]*Lv[1]+nv[2]*Lv[2]);
    const sp=Math.pow(Math.max(0,nv[0]*Hv[0]+nv[1]*Hv[1]+nv[2]*Hv[2]),24);
    const t=(front?.18:.08)+(front?.62:.45)*d+.35*sp;
    const hw=w/2;
    const q=[[a.x-a.tx*hw,a.y-a.ty*hw],[b.x-b.tx*hw,b.y-b.ty*hw],[b.x+b.tx*hw,b.y+b.ty*hw],[a.x+a.tx*hw,a.y+a.ty*hw]];
    quads.push({q,z:Math.sin(thm),c:(opt.ramp||gold)(t)});
  }
  quads.sort((u,v)=>u.z-v.z);
  const g=el('g',{opacity:opt.opacity||1},parent);
  if(opt.filter)g.setAttribute('filter',opt.filter);
  for(const k of quads) el('polygon',{points:k.q.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),fill:k.c,stroke:k.c,'stroke-width':.7,'stroke-linejoin':'round'},g);
  return g;
}

// ---------- balloons ----------
const bl=$('balloons');
const strG=el('g',{mask:'url(#strFade)'},bl);
function balloon(x,y,s,rot,kind,opt={}){
  const g=el('g',{transform:`translate(${x},${y}) rotate(${rot}) scale(${s})`},bl);
  if(opt.blur){g.setAttribute('filter','url(#blur4)');g.setAttribute('opacity',opt.op||.55);}
  el('use',{href:'#bal',fill:kind==='gold'?'url(#balGold)':'url(#balRed)'},g);
  el('use',{href:'#bal',fill:opt.side==='L'?'url(#rimL)':'url(#rimR)'},g);
  if(opt.reactor){
    const r=el('g',{transform:'translate(12,4) rotate(18) scale(.84,.93) rotate(-18)'},g);
    el('circle',{r:50,fill:'#12060a',opacity:.45},r);
    el('circle',{r:47,fill:'none',stroke:'url(#bezelG)','stroke-width':5},r);
    const rg=el('g',{filter:'url(#glowC)'},r);
    for(let i=0;i<10;i++){const a0=i/10*2*Math.PI+.08,a1=(i+1)/10*2*Math.PI-.08,P=(a,rr)=>(Math.cos(a)*rr).toFixed(2)+','+(Math.sin(a)*rr).toFixed(2);
      el('path',{d:`M${P(a0,25)} L${P(a0,40)} A40,40 0 0,1 ${P(a1,40)} L${P(a1,25)} A25,25 0 0,0 ${P(a0,25)}Z`,fill:'#e2fcff'},rg);}
    el('circle',{r:17,fill:'#f6ffff'},rg);
    el('circle',{r:50,fill:'url(#embShade)'},r);
  }
  el('ellipse',{cx:-40,cy:-50,rx:15,ry:28,transform:'rotate(32 -40 -50)',fill:'#fff',opacity:kind==='gold'?.75:.55,filter:'url(#soft)'},g);
  el('ellipse',{cx:-45,cy:-57,rx:4.5,ry:9,transform:'rotate(32 -45 -57)',fill:'#fff',opacity:.9},g);
  el('path',{d:'M-8,103 L8,103 L12,114 Q0,118 -12,114Z',fill:kind==='gold'?'#8a5714':'#7a0712'},g);
  const a=rot*Math.PI/180;
  return {kx:x-Math.sin(a)*114*s, ky:y+Math.cos(a)*114*s, blur:opt.blur};
}
// background (out of focus) balloons first
const bgB=[[40,430,.72,-10,'red',{blur:1,op:.5,side:'R'}],[1052,388,.62,10,'gold',{blur:1,op:.45,side:'L'}],[330,1010,.0001,0,'red',{blur:1}]];
const knots=[];
const left=[[246,492,.76,-6,'gold',{side:'R'}],[110,590,1.05,-8,'red',{side:'R'}],[92,790,.84,5,'gold',{side:'R'}],[240,717,.62,6,'red',{side:'R'}]];
const right=[[828,466,.72,4,'gold',{side:'L'}],[968,578,1.14,8,'red',{reactor:true,side:'L'}],[990,796,.82,-6,'gold',{side:'L'}],[846,730,.62,-3,'red',{side:'L'}]];
for(const b of left) knots.push(balloon(...b));
for(const b of right) knots.push(balloon(...b));
knots.forEach((k,i)=>{
  const toX = i<4?190:890, toY=960;
  const p=`M${k.kx.toFixed(1)},${k.ky.toFixed(1)} C${(k.kx+R(-20,20)).toFixed(1)},${(k.ky+70).toFixed(1)} ${(toX+R(-30,30)).toFixed(1)},${(toY-110).toFixed(1)} ${toX},${toY}`;
  el('path',{d:p,fill:'none',stroke:'#f6e2b8','stroke-width':1.3,opacity:.5},strG);
});
// short curled gold ribbons under each knot
const curlG=el('g',{},bl); bl.insertBefore(curlG,bl.firstChild.nextSibling);
knots.forEach((k,i)=>{const len=R(70,105)-(i===0?34:0), dx=R(-14,14);
  curl(curlG,[k.kx,k.ky+2],[k.kx+dx*.5,k.ky+len*.5],[k.kx+dx,k.ky+len],R(4.5,6),R(5,7),3.4,{phase:R(0,6),taper:.25});});
// cyan spill from reactor balloon
el('circle',{cx:980,cy:578,r:76,fill:'#8fe9ff',opacity:.06,filter:'url(#shadowF)',style:'mix-blend-mode:screen'},bl);

// ---------- streamers ----------
const st=$('streamers');
curl(st,[34,-20],[96,90],[46,214],6.5,20,9,{phase:.4,taper:.3});
curl(st,[168,-20],[188,60],[226,150],4,15,8,{phase:1.8,taper:.3});
curl(st,[1046,-20],[984,90],[1034,214],6.5,20,9,{phase:2.2,taper:.3});
curl(st,[912,-20],[892,60],[854,150],4,15,8,{phase:.9,taper:.3});
curl(st,[20,1650],[70,1560],[44,1440],5,16,8,{phase:1.1,taper:.3});
curl(st,[1060,1650],[1010,1560],[1036,1440],5,16,8,{phase:2.6,taper:.3});

// ---------- HUD tick ring around the medal ----------
const hud=$('hud');
for(let i=0;i<120;i++){
  const a=i/120*2*Math.PI, major=i%10===0, mid=i%5===0;
  const r0=226, r1=major?240:(mid?235:231);
  el('line',{x1:(CX+Math.cos(a)*r0).toFixed(2),y1:(CY+Math.sin(a)*r0).toFixed(2),x2:(CX+Math.cos(a)*r1).toFixed(2),y2:(CY+Math.sin(a)*r1).toFixed(2),'stroke-width':major?2:1.1,opacity:major?.9:.55},hud);
}
const arc=(r,d0,d1)=>{const a0=d0*Math.PI/180,a1=d1*Math.PI/180;return `M${(CX+Math.cos(a0)*r).toFixed(2)},${(CY+Math.sin(a0)*r).toFixed(2)} A${r},${r} 0 0,1 ${(CX+Math.cos(a1)*r).toFixed(2)},${(CY+Math.sin(a1)*r).toFixed(2)}`};
[[-158,-112],[-68,-22],[22,40],[140,158]].forEach(([a,b])=>el('path',{d:arc(248,a,b),'stroke-width':2.2,opacity:.9,'stroke-linecap':'round'},hud));
el('circle',{cx:CX,cy:CY,r:226,'stroke-width':1,opacity:.35},hud);

// ---------- confetti ----------
const cf=$('confetti');
const excl=[[230,44,620,110],[80,190,920,52],[60,236,960,134],[300,790,480,110],[70,900,940,96],[92,1024,896,200],[100,1250,880,286]];
// confetti keep-out zones pinned to the original balloon spots so the seeded confetti layout does not reshuffle
const balls=[[246,492,.76],[126,590,1.05],[92,790,.84],[240,705,.62],[828,466,.72],[950,578,1.14],[1000,796,.82],[846,730,.62]].map(b=>[b[0],b[1]-4,98*b[2]]);
const liveBalls=[...left,...right].map(b=>[b[0],b[1]-4,98*b[2]]);
// outer border boxes (incl. stroke) of the callout plate and the info card
const frames=[[82.5,1022.5,915,171],[82.5,1240.5,915,303]];
const inEx=(x,y,m=16)=>balls.some(([bx,by,br])=>Math.hypot(x-bx,y-by)<br+6)||excl.some(([ex,ey,ew,eh])=>x>ex-m&&x<ex+ew+m&&y>ey-m&&y<ey+eh+m)||Math.hypot(x-CX,y-CY)<252||(y<420&&x>200&&x<880)||(x<44||x>1036||y<44||y>1576);
const fills=['url(#cgA)','url(#cgB)','url(#cgA)','url(#cgR)','url(#cgW)'];
let placed=0,guard=0;const pts=[];
while(placed<96&&guard<9000){guard++;
  const x=R(20,1060),y=R(20,1600);
  if(inEx(x,y))continue;
  if(pts.some(([px,py])=>Math.hypot(px-x,py-y)<34))continue;
  pts.push([x,y]);
  const edge=(x<70||x>1010||y>1200);
  const big=edge&&rnd()<.35, f=big?(rnd()<.5?'url(#cgA)':'url(#cgB)'):fills[Math.floor(rnd()*fills.length)];
  const rot=R(0,180), sx=R(.3,1);
  const g=el('g',{transform:`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(1,${sx.toFixed(2)})`,opacity:big?.6:R(.75,1).toFixed(2)},cf);
  if(big)g.setAttribute('filter','url(#dof)');
  const s=big?R(1.8,2.4):R(.8,1.25);
  const t=rnd();
  if(t<.72) el('rect',{x:-10*s,y:-4*s,width:20*s,height:8*s,rx:1.2,fill:f},g);
  else el('circle',{r:5*s,fill:f},g);
  // drop (without touching the rnd sequence) any piece that now grazes a nudged balloon
  if(liveBalls.some(([bx,by,br])=>Math.hypot(x-bx,y-by)<br+6)||knots.some(k=>Math.hypot(x-k.kx,y-k.ky)<24)) g.remove();
  // ...and any piece whose real extent (rotation, scale, depth-of-field blur) would reach the gold border
  // of the callout plate or the info card, so only pieces fully inside the side gutters survive there
  else{
    const ca=Math.abs(Math.cos(rot*Math.PI/180)), sa=Math.abs(Math.sin(rot*Math.PI/180));
    const [hw,hh]=t<.72?[10*s,4*s*sx]:[5*s,5*s*sx];
    const pad=(big?8:1)+5;
    const ex=t<.72?ca*hw+sa*hh:Math.hypot(hw*ca,hh*sa), ey=t<.72?sa*hw+ca*hh:Math.hypot(hw*sa,hh*ca);
    if(frames.some(([fx,fy,fw,fh])=>x+ex+pad>fx&&x-ex-pad<fx+fw&&y+ey+pad>fy&&y-ey-pad<fy+fh)) g.remove();
  }
  placed++;
}

// ---------- glints ----------
const gl=$('glints');
function glint(x,y,s,o=1){const g=el('g',{transform:`translate(${x},${y}) scale(${s})`,opacity:o,filter:'url(#glint)'},gl);
  el('circle',{r:6,fill:'#fff6d8',opacity:.5},g);
  el('path',{d:'M0,-22 C1.5,-3 1.5,-1.5 22,0 C1.5,1.5 1.5,3 0,22 C-1.5,3 -1.5,1.5 -22,0 C-1.5,-1.5 -1.5,-3 0,-22Z',fill:'#fffdf2'},g);}
// glints only on capitals / metal, never above lowercase letters
glint(185,256,.62); glint(452,470,.9); glint(468,540,.6); glint(1000,1046,.55);
// tiny floating sparkles (kept clear of all text)
[[300,420,.45],[780,404,.4],[128,996,.5],[952,996,.45],[70,300,.4],[1010,300,.35],[60,1580,.4],[1022,1230,.4]].forEach(p=>glint(p[0],p[1],p[2],.85));
